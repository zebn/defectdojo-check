name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: '30 1 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript
          output: ${{ runner.temp }}/codeql-results

      - name: Import CodeQL results into DefectDojo
        if: github.event_name == 'push' || github.event_name == 'schedule'
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DEFECTDOJO_ENGAGEMENT_ID: ${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}
        run: |
          set -euo pipefail

          test -n "$DEFECTDOJO_URL" || { echo "Falta el secret DEFECTDOJO_URL" >&2; exit 1; }
          test -n "$DEFECTDOJO_API_KEY" || { echo "Falta el secret DEFECTDOJO_API_KEY" >&2; exit 1; }
          test -n "$DEFECTDOJO_ENGAGEMENT_ID" || { echo "Falta el secret DEFECTDOJO_ENGAGEMENT_ID" >&2; exit 1; }

          sarif_file="$(find "$RUNNER_TEMP/codeql-results" -type f -name '*.sarif' -print -quit)"
          test -n "$sarif_file" || { echo "CodeQL no produjo un archivo SARIF" >&2; exit 1; }

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Token $DEFECTDOJO_API_KEY" \
            --header "Accept: application/json" \
            --form "scan_type=SARIF" \
            --form "engagement=$DEFECTDOJO_ENGAGEMENT_ID" \
            --form "file=@$sarif_file" \
            --form "active=true" \
            --form "verified=false" \
            --form "close_old_findings=true" \
            "$DEFECTDOJO_URL/api/v2/import-scan/"